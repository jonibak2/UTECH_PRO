<style>
/* ===== Base ===== */
body {
  font-family: Arial, sans-serif;
  background: #ffffff;
  padding: 10px;
  margin: 0;
}

.container {
  max-width: 600px;
  margin: auto;
  animation: fadeInUp 0.5s ease-out forwards;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(-15px); }
  to { opacity: 1; transform: translateY(0); }
}

h1 {
  text-align: center;
  margin-bottom: 15px;
  font-size: 1.5em;
}

.logo {
  display: block;
  max-width: 320px;
  height: auto;
  margin: 0 auto 15px auto;
}

.form-group {
  margin-bottom: 12px;
}

label {
  font-weight: bold;
  display: block;
  margin-bottom: 5px;
  font-size: 0.9em;
}

.required {
  color: red;
}

input, textarea, select {
  width: 100%;
  padding: 8px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 0.9em;
  box-sizing: border-box;
}

textarea {
  min-height: 60px;
  resize: vertical;
}

.phone-item {
  display: flex;
  gap: 4px;
  margin-bottom: 6px;
}

.phone-item input[type="tel"] {
  flex: 2;
}

.phone-item input[type="text"] {
  flex: 2;
}

.remove-phone {
  width: 32px;
  min-width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #ff4444;
  color: white;
  border: none;
  font-size: 14px;
  cursor: pointer;
  padding: 0;
}

.add-btn {
  margin-top: 6px;
  background: #e0e0e0;
  border: none;
  padding: 8px;
  border-radius: 6px;
  cursor: pointer;
  width: 100%;
  font-size: 0.9em;
}

.submit-btn {
  background: #6AB053;
  color: white;
  font-weight: bold;
  border: none;
  padding: 12px;
  border-radius: 6px;
  cursor: pointer;
  width: 100%;
  font-size: 1em;
  margin-top: 10px;
}

.submit-btn:hover {
  background: #5A9043;
}

.error-message {
  background: #f44336;
  color: white;
  padding: 12px;
  border-radius: 6px;
  text-align: center;
  margin-top: 15px;
}

.success-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  opacity: 0;
  animation: overlayFadeIn 0.5s ease-out forwards;
}

@keyframes overlayFadeIn {
  0% { opacity: 0; transform: scale(0.9); }
  100% { opacity: 1; transform: scale(1); }
}

.success-checkmark {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 30px;
  animation: checkmarkPop 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.3s forwards;
  transform: scale(0);
}

@keyframes checkmarkPop {
  0% { transform: scale(0) rotate(0deg); }
  50% { transform: scale(1.2) rotate(180deg); }
  100% { transform: scale(1) rotate(360deg); }
}

.checkmark-icon {
  font-size: 60px;
  color: #4caf50;
  animation: checkmarkDraw 0.4s ease-out 0.6s forwards;
  opacity: 0;
}

@keyframes checkmarkDraw {
  to { opacity: 1; }
}

.success-text {
  color: white;
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 10px;
  animation: textSlideUp 0.5s ease-out 0.8s forwards;
  opacity: 0;
  transform: translateY(20px);
}

@keyframes textSlideUp {
  to { opacity: 1; transform: translateY(0); }
}

.success-subtext {
  color: rgba(255, 255, 255, 0.9);
  font-size: 16px;
  animation: textSlideUp 0.5s ease-out 1s forwards;
  opacity: 0;
  transform: translateY(20px);
}

.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  background: #ffd700;
  animation: confettiFall 3s linear forwards;
}

@keyframes confettiFall {
  0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}
</style>
</head>

<body>

<button class="nav-hamburger" id="nav-toggle">
  <span class="hamburger-line"></span>
  <span class="hamburger-line"></span>
  <span class="hamburger-line"></span>
</button>

<div class="nav-overlay" id="nav-overlay"></div>

<nav class="nav-drawer" id="nav-drawer">
  <div class="nav-drawer-header">
    <img src="project/assets/utech.png" alt="Utech">
    <div class="nav-drawer-title">תפריט</div>
  </div>
  <div class="nav-drawer-items">
    <a href="index.html" class="nav-item schedule" data-page="index">סידור עבודה</a>
    <a href="view.html" class="nav-item logs" data-page="view">יומני עבודה</a>
    <a href="tofes.html" class="nav-item fill-notes" data-page="tofes">מילוי יומן עבודה</a>
    <a href="codes-list.html" class="nav-item building-codes" data-page="codes-list">קודים לבניינים</a>
    <a href="pending-form.html" class="nav-item fill-notes active" data-page="pending-form">מילוי משימה עתידית</a>
    <a href="pending-tasks.html" class="nav-item service" data-page="pending-tasks">משימות ממתינות</a>
    <a href="#" class="nav-item service" data-page="service">קריאות שירות פתוחות</a>
    <a href="#" class="nav-item fill-service" data-page="fill-service">מילוי קריאת שירות</a>
    <a href="#" class="nav-item service-agreement" data-page="service-agreement">הסכמי שירות</a>
    <a href="#" class="nav-item fill-service-agreement" data-page="fill-service-agreement">מילוי הסכמי שירות</a>
  </div>
</nav>

<div class="container">
  <img src="project/assets/utech.png" alt="Utech" class="logo">
  <h1>מילוי משימה עתידית</h1>

  <form id="pendingForm">
    <div class="form-group">
      <label>כתובת <span class="required">*</span></label>
      <input type="text" id="address" placeholder="הזן כתובת" required>
    </div>

    <div class="form-group">
      <label>קוד כניסה <span class="required">*</span></label>
      <input type="text" id="code" placeholder="🔑 הזן קוד כניסה" required>
    </div>

    <div class="form-group">
      <label>טלפון <span class="required">*</span></label>
      <div id="phoneList">
        <div class="phone-item">
          <input type="tel" class="phone-number" placeholder="📞 מספר טלפון" required>
          <input type="text" class="phone-name" placeholder="🙍‍♂️ שם איש קשר" required>
        </div>
      </div>
      <button type="button" class="add-btn" id="addPhoneBtn">➕ הוסף טלפון</button>
    </div>

    <div class="form-group">
      <label>משימה <span class="required">*</span></label>
      <textarea id="reason" placeholder="📰 הזן משימה" required></textarea>
    </div>

    <div class="form-group">
      <label>הערות</label>
      <textarea id="comments" placeholder="📎 הזן הערות"></textarea>
    </div>

    <button type="submit" class="submit-btn">שלח</button>
  </form>

  <div id="message"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAFTYDz4TvUfiXx1F3xFer86WV-UMVRi7U",
  authDomain: "tablichka-e2c39.firebaseapp.com",
  databaseURL: "https://tablichka-e2c39-default-rtdb.firebaseio.com",
  projectId: "tablichka-e2c39",
  storageBucket: "tablichka-e2c39.appspot.com",
  messagingSenderId: "218058227797",
  appId: "1:218058227797:web:0525b8e6057350918c54dc",
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

function addPhone() {
  const div = document.createElement("div");
  div.className = "phone-item";
  div.innerHTML = `
    <input type="tel" class="phone-number" placeholder="📞 מספר טלפון" required>
    <input type="text" class="phone-name" placeholder="🙍‍♂️ שם איש קשר" required>
    <button type="button" class="remove-phone">✕</button>
  `;
  div.querySelector(".remove-phone").addEventListener("click", () => {
    if (document.querySelectorAll(".phone-item").length > 1) div.remove();
  });
  document.getElementById("phoneList").appendChild(div);
}

document.getElementById("addPhoneBtn").addEventListener("click", addPhone);

function collectPhones() {
  const phones = [];
  document.querySelectorAll(".phone-item").forEach((item) => {
    const phone = item.querySelector(".phone-number").value.trim();
    const name = item.querySelector(".phone-name").value.trim();
    if (phone && name) phones.push({ phone, name });
  });
  return phones;
}

function showSuccessOverlay() {
  const overlay = document.createElement("div");
  overlay.className = "success-overlay";
  overlay.innerHTML = `
    <div class="success-checkmark">
      <div class="checkmark-icon">✓</div>
    </div>
    <div class="success-text">!המשימה נשמרה בהצלחה</div>
    <div class="success-subtext">הנתונים נשמרו במערכת</div>
  `;

  for (let i = 0; i < 50; i++) {
    const confetti = document.createElement("div");
    confetti.className = "confetti";
    confetti.style.left = Math.random() * 100 + "%";
    confetti.style.background = ["#ffd700", "#ff6b6b", "#4ecdc4", "#45b7d1", "#f7b731"][Math.floor(Math.random() * 5)];
    confetti.style.animationDelay = Math.random() * 0.5 + "s";
    confetti.style.animationDuration = (Math.random() * 2 + 2) + "s";
    overlay.appendChild(confetti);
  }

  document.body.appendChild(overlay);

  setTimeout(() => {
    overlay.style.animation = "overlayFadeIn 0.5s ease-out reverse";
    setTimeout(() => {
      overlay.remove();
      document.getElementById("pendingForm").reset();
      document.getElementById("phoneList").innerHTML = `
        <div class="phone-item">
          <input type="tel" class="phone-number" placeholder="📞 מספר טלפון" required>
          <input type="text" class="phone-name" placeholder="🙍‍♂️ שם איש קשר" required>
        </div>
      `;
    }, 500);
  }, 2500);
}

document.getElementById("pendingForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const messageDiv = document.getElementById("message");

  const address = document.getElementById("address").value.trim();
  const code = document.getElementById("code").value.trim();
  const reason = document.getElementById("reason").value.trim();
  const comments = document.getElementById("comments").value.trim();
  const phones = collectPhones();

  if (!address || !code || !reason) {
    messageDiv.innerHTML = '<div class="error-message">נא למלא את כל השדות החובה</div>';
    setTimeout(() => (messageDiv.innerHTML = ""), 3000);
    return;
  }

  if (!phones.length) {
    messageDiv.innerHTML = '<div class="error-message">נא למלא לפחות טלפון אחד עם שם</div>';
    setTimeout(() => (messageDiv.innerHTML = ""), 3000);
    return;
  }

  try {
    const counterRef = ref(database, "pending-tasks-meta/nextId");
    const { snapshot } = await runTransaction(counterRef, (current) => (current || 0) + 1);
    const taskId = snapshot.val();

    await set(ref(database, `pending-tasks/${taskId}`), {
      address,
      code,
      phones,
      reason,
      comments,
      status: "ממתין",
      createdAt: Date.now(),
    });
    showSuccessOverlay();
  } catch (err) {
    console.error(err);
    messageDiv.innerHTML = '<div class="error-message">שגיאה בשמירה. נסה שוב.</div>';
    setTimeout(() => (messageDiv.innerHTML = ""), 3000);
  }
});

function setupNavigation() {
  const navToggle = document.getElementById("nav-toggle");
  const navDrawer = document.getElementById("nav-drawer");
  const navOverlay = document.getElementById("nav-overlay");
  const navItems = document.querySelectorAll(".nav-item");
  const protectedPages = new Set(["view", "tofes"]);
  const isDesktop = window.matchMedia("(min-width: 769px)").matches;

  if (!navToggle || !navDrawer || !navOverlay) return;

  const closeDrawer = () => {
    navToggle.classList.remove("active");
    navDrawer.classList.remove("active");
    navOverlay.classList.remove("active");
  };

  if (!isDesktop) {
    closeDrawer();
    return;
  }

  navToggle.addEventListener("click", () => {
    navToggle.classList.toggle("active");
    navDrawer.classList.toggle("active");
    navOverlay.classList.toggle("active");
  });

  navOverlay.addEventListener("click", closeDrawer);

  navItems.forEach((item) => {
    item.addEventListener("click", (e) => {
      const targetPage = item.getAttribute("data-page");
      if (protectedPages.has(targetPage)) {
        const accessCode = prompt("הכנס סיסמה:");
        if (accessCode !== "1") {
          e.preventDefault();
          alert("סיסמה שגויה");
          return;
        }
      }
      closeDrawer();
    });
  });
}

setupNavigation();
</script>

</body>
</html>
