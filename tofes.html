<style>\n/* ===== Base ===== */
body {
  font-family: Arial, sans-serif;
  background: #ffffff;
  padding: 10px;
  margin: 0;
}

.header-nav {
  display: none;
  max-width: 600px;
  margin: 0 auto 20px auto;
  justify-content: space-between;
  align-items: center;
}

.nav-btn {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  background: #6AB053;
  color: white;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s;
  text-decoration: none;
  display: inline-block;
}

.nav-btn:hover {
  background: #5A9043;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(106, 176, 83, 0.3);
}

.nav-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}

.nav-sub-btn {
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  background: #6AB053;
  color: white;
  font-weight: bold;
  font-size: 13px;
  cursor: not-allowed;
  opacity: 0.6;
  transition: all 0.3s;
  text-decoration: none;
  display: inline-block;
}

.nav-sub-btn:hover {
  background: #6AB053;
}

@media (min-width: 769px) {
  .header-nav {
    display: flex;
  }
}

.container {
  max-width: 600px;
  margin: auto;
  animation: fadeInUp 0.5s ease-out forwards;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(-15px); }
  to { opacity: 1; transform: translateY(0); }
}

h1 {
  text-align: center;
  margin-bottom: 15px;
  font-size: 1.5em;
}

.logo {
  display: block;
  max-width: 320px;
  height: auto;
  margin: 0 auto 15px auto;
}

.form-group {
  margin-bottom: 12px;
}

label {
  font-weight: bold;
  display: block;
  margin-bottom: 5px;
  font-size: 0.9em;
}

.required {
  color: red;
}

input, textarea, select {
  width: 100%;
  padding: 8px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 0.9em;
  box-sizing: border-box;
}

textarea {
  min-height: 60px;
  resize: vertical;
}



/* Main Form */
#workForm {
  animation: fadeInUp 0.5s ease-out forwards;
}

#workForm.hidden {
  display: none;
}
.floor-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
  gap: 6px;
}

.floor-chip {
  background: #f1f1f1;
  border-radius: 8px;
  text-align: center;
  padding: 8px 0;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
  user-select: none;
  font-size: 0.85em;
}

.floor-chip:hover {
  transform: scale(1.05);
}

.floor-chip.active {
  background: #6AB053;
  color: white;
}

/* ===== Floor box ===== */
.floor-box {
  background: #f8f9fa;
  border-radius: 8px;
  padding: 10px;
  margin-top: 8px;
  animation: fadeInUp 0.35s ease-out forwards;
}

.floor-title {
  font-weight: bold;
  margin-bottom: 6px;
  font-size: 0.9em;
}

/* ===== Submit ===== */
.submit-btn {
  background: #6AB053;
  color: white;
  font-weight: bold;
  border: none;
  padding: 12px;

/* Selection Step */
.selection-step {
  animation: fadeInUp 0.5s ease-out forwards;
}

.selection-step .form-group {
  margin-bottom: 15px;
}

.selection-step select {
  width: 100%;
  padding: 12px;
  border-radius: 6px;
  border: 2px solid #e0e0e0;
  font-size: 0.95em;
  box-sizing: border-box;
  background: white;
  cursor: pointer;
}

.selection-step select:focus {
  border-color: #6AB053;
  outline: none;
}

/* Worker chips for mobile */
.worker-chips {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
  gap: 8px;
  margin-bottom: 15px;
}

.worker-chip {

}

.worker-chip:hover {

}

.worker-chip.active {

  color: white;

/* User Header */
.user-header {
  display: none;
}

.user-header.active {

}

.user-info {

/* Project chips */
.project-chips {

.project-chip {

.project-chip:hover {
  transform: translateY(-3px);

.project-chip.active {

/* ===== Success Overlay Animation ===== */
.success-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  opacity: 0;
  animation: overlayFadeIn 0.5s ease-out forwards;
}

@keyframes overlayFadeIn {
  0% {
    opacity: 0;
    transform: scale(0.9);
  }
  100% {
    opacity: 1;
    transform: scale(1);
  }
}

.success-checkmark {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 30px;
  animation: checkmarkPop 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.3s forwards;
  transform: scale(0);
}

@keyframes checkmarkPop {
  0% {
    transform: scale(0) rotate(0deg);
  }
  50% {
    transform: scale(1.2) rotate(180deg);
  }
  100% {
    transform: scale(1) rotate(360deg);
  }
}

.checkmark-icon {
  font-size: 60px;
  color: #4caf50;
  animation: checkmarkDraw 0.4s ease-out 0.6s forwards;

}

@keyframes checkmarkDraw {

.success-text {

  font-size: 28px;

}

@keyframes textSlideUp {
  to {

  }

.success-subtext {
  color: rgba(255, 255, 255, 0.9);

.confetti {
  position: absolute;

  }

  }

</style>
</head>

<script type="module">
/* ===== Firebase Setup ===== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, set, onValue, forceWebSockets } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDuvwDMAsyQSURluc7Mr-Ow5r2Iq2xh9P8",
  authDomain: "tofes-43c54.firebaseapp.com",
  databaseURL: "https://tofes-43c54-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tofes-43c54",
  storageBucket: "tofes-43c54.firebasestorage.app",
  messagingSenderId: "634166786476",
  appId: "1:634166786476:web:e5118489dcf3066fcba209"
};

const app = initializeApp(firebaseConfig);
forceWebSockets();
const database = getDatabase(app);

        /* ===== Load projects from Firebase ===== */
        let projectsData = {};
        
        function loadWorkers() {
            const workerChipsContainer = document.getElementById('workerChips');
            const workers = ['פאבל', 'שי', 'ויקטור', 'פימה', 'יהונתן', 'איציק', 'יורי', 'ראובן'];
            
            // Clear existing chips
            workerChipsContainer.innerHTML = '';
            
            // Load from localStorage
            const savedWorker = localStorage.getItem('selectedWorker');
            
            // Create mobile chips
            workers.forEach((worker, index) => {
                const chip = document.createElement('div');
                chip.className = 'worker-chip';
                chip.textContent = worker;
                chip.style.animationDelay = `${index * 0.08}s`;
                
                if (savedWorker === worker) {
                    chip.classList.add('active');
                    selectWorker(worker);
                }
                
                chip.addEventListener('click', () => {
                    selectWorker(worker);
                });
                
                workerChipsContainer.appendChild(chip);
            });
        }
        
        function selectWorker(worker) {
            // Save to localStorage
            localStorage.setItem('selectedWorker', worker);
            
            // Hide all chips
            document.getElementById('workerChips').style.display = 'none';
            document.getElementById('workerSelectionContainer').style.display = 'none';
            
            // Update selected user name in status bar
            document.getElementById('selectedUserName').textContent = worker;
            
            // Show project selection
            document.getElementById('projectSelectionContainer').style.display = 'block';
            
            // Setup change button
            document.getElementById('changeUserBtn').addEventListener('click', resetWorkerSelection);
        }
        
        function resetWorkerSelection() {
            localStorage.removeItem('selectedWorker');
            document.getElementById('workerChips').style.display = 'grid';
            document.getElementById('workerSelectionContainer').style.display = 'block';
            document.getElementById('projectSelectionContainer').style.display = 'none';
            const workForm = document.getElementById('workForm');
            workForm.classList.add('hidden');
            workForm.style.display = 'none';
            activeFloors.clear();
            floorWorkContainer.innerHTML = '';
            document.querySelectorAll('.floor-chip').forEach(chip => chip.classList.remove('active'));
            
            // Reload workers
            loadWorkers();
        }

        function loadProjects() {
            const projectChipsContainer = document.getElementById('projectChips');
            const projectsRef = ref(database, 'projects');
            
            onValue(projectsRef, (snapshot) => {
                projectsData = {};
                const projects = snapshot.val() || {};
                
                Object.entries(projects).forEach(([id, project]) => {
                    projectsData[project.name] = project;
                });
                
                const projectArray = Object.values(projects).sort((a, b) => 
                    a.name.localeCompare(b.name, 'he')
                );

                // Clear existing chips
                projectChipsContainer.innerHTML = '';

                projectArray.forEach((project, index) => {
                    const chip = document.createElement('div');
                    chip.className = 'project-chip';
                    chip.textContent = project.name;
                    chip.style.animationDelay = `${index * 0.08}s`;
                    
                    chip.addEventListener('click', () => {
                        selectProject(project);
                    });
                    
                    projectChipsContainer.appendChild(chip);
                });
            });
        }
        
        function selectProject(project) {
            const savedWorker = localStorage.getItem('selectedWorker');
            
            if (!savedWorker) {
                alert('בחר שם עובד');
                return;
            }
            
            // Update display
            document.getElementById('selectedWorkerDisplay').textContent = `עובד: ${savedWorker}`;
            document.getElementById('selectedProjectDisplay').textContent = `פרויקט: ${project.name}`;
            document.getElementById('managerNameDisplay').textContent = project.manager || '-';
            document.getElementById('managerPhoneDisplay').textContent = project.phone || '-';
            
            // Hide selection step, show form with animation
            document.getElementById('selectionStep').style.display = 'none';
            const workForm = document.getElementById('workForm');
            workForm.classList.remove('hidden');
            workForm.style.display = 'block';
            
            // Generate floor chips based on project data
            generateFloorChips(project.floors || 0);
            
            // Set today's date
            document.getElementById('workDate').valueAsDate = new Date();
        }

        // Load workers and projects when page loads
        loadWorkers();
        loadProjects();
        
        // Restore user on page load
        function restoreUser() {
            const savedWorker = localStorage.getItem('selectedWorker');
            if (savedWorker) {
                selectWorker(savedWorker);
            }
        }
        
        restoreUser();

        // Back button
        document.getElementById('backBtn').addEventListener('click', () => {
            document.getElementById('selectionStep').style.display = 'block';
            const workForm = document.getElementById('workForm');
            workForm.classList.add('hidden');
            workForm.style.display = 'none';
            
            // Reset form
            document.getElementById('workForm').reset();
            activeFloors.clear();
            floorWorkContainer.innerHTML = '';
            document.querySelectorAll('.floor-chip').forEach(chip => chip.classList.remove('active'));
        });
        async function saveReport(data) {
          try {
            console.log('Saving report to Firebase...');
            
            const workerName = data.workerName;
            const workDate = data.workDate;
            
            // Structure: workLogs/{workerName}/{date}/{project}/{reportData}
            const reportPath = `workLogs/${workerName}/${workDate}/${data.project}`;
            const reportRef = ref(database, reportPath);
            
            await set(reportRef, {
              floors: data.floors,
              issues: data.issues,
              nextVisit: data.nextVisit,
              timestamp: data.timestamp
            });
            
            console.log('Saved successfully to Firebase at:', reportPath);
            return true;
          } catch (err) {
            console.error('Error saving to Firebase:', err);
            return false;
          }
        }

/* ===== Address input removed - no autocomplete ===== */

/* ===== Floors ===== */
const floorGrid = document.getElementById("floorGrid");
const floorWorkContainer = document.getElementById("floorWorkContainer");
const activeFloors = new Map();

function generateFloorChips(numberOfFloors) {
  // Clear existing chips
  floorGrid.innerHTML = '';
  activeFloors.clear();
  floorWorkContainer.innerHTML = '';
  
  // Generate chips in order: 0 (קרקע), then 1..numberOfFloors, then -1..-5
  const floorsArray = [];
  
  // Add ground floor
  floorsArray.push(0);
  
  // Add positive floors
  for (let i = 1; i <= numberOfFloors; i++) {
    floorsArray.push(i);
  }
  
  // Add negative floors (in order -1, -2, -3, -4, -5)
  for (let i = -1; i >= -5; i--) {
    floorsArray.push(i);
  }
  
  floorsArray.forEach(floor => {
    const chip = document.createElement("div");
    chip.className = "floor-chip";
    
    if (floor < 0) {
      chip.textContent = `${floor}`;
    } else if (floor === 0) {
      chip.textContent = '0';
    } else {
      chip.textContent = `${floor}`;
    }
    
    chip.addEventListener('click', () => toggleFloor(floor, chip));
    floorGrid.appendChild(chip);
  });
}

// Initial generation with 0 floors (will be updated when project is selected)
generateFloorChips(0);

function toggleFloor(floor, chip) {
  if (activeFloors.has(floor)) {
    activeFloors.delete(floor);
    chip.classList.remove("active");
    document.querySelector(`.floor-box[data-floor="${floor}"]`)?.remove();
  } else {
    activeFloors.set(floor, { equipment: '', status: '' });
    chip.classList.add("active");

    let floorLabel = '';
    if (floor < 0) {
      floorLabel = `${floor}`;
    } else if (floor === 0) {
      floorLabel = 'קרקע';
    } else {
      floorLabel = `${floor}`;
    }

    const box = document.createElement("div");
    box.className = "floor-box";
    box.dataset.floor = floor;
    
    const equipmentOptions = [
      'לובי 1 גלאי 1',
      'לובי 1 גלאי 2',
      'לובי מעליות',
      'לובי 2 גלאי 1',
      'לובי 2 גלאי 2',
      'שוט',
      'מדרגות 1',
      'מדרגות 2',
      'IN',
      'לחצן 1',
      'לחצן 2',
      'צופר 1',
      'צופר 2',
      'מגנט 1',
      'מגנט 2',
      'מגנט 3',
      'מגנט 4',
      'שקע טלפון חדר מדרגות 1',
      'שקע טלפון חדר מדרגות 2',
      'שקע טלפון לובי מעליות',
      'רמקול לובי 1',
      'רמקול לובי 2',
      'רמקול לובי מעליות',
      'רמקול חדר מדרגות 1',
      'רמקול חדר מדרגות 2'
    ];
    
    const statusOptions = [
      'לא בוצע צנרת',
      'חיווט בלבד',
      'הותקן אביזר קופ (למעט גלאי)',
      'הותקן גלאי',
      'הותקן בסיס'
    ];
    
    box.innerHTML = `
      <div class="floor-title">עבודה שבוצעה ב${floorLabel}</div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div>
          <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 5px;">אביזר</label>
          <select class="floor-equipment-select" data-floor="${floor}" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.85em;">
            <option value="">בחר אביזר...</option>
          </select>
        </div>
        <div>
          <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 5px;">סטטוס</label>
          <select class="floor-status-select" data-floor="${floor}" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.85em;">
            <option value="">בחר סטטוס...</option>
          </select>
        </div>
      </div>
    `;
    
    const equipmentSelect = box.querySelector('.floor-equipment-select');
    const statusSelect = box.querySelector('.floor-status-select');
    
    // Populate equipment options
    equipmentOptions.forEach(option => {
      const opt = document.createElement('option');
      opt.value = option;
      opt.textContent = option;
      equipmentSelect.appendChild(opt);
    });
    
    // Populate status options
    statusOptions.forEach(option => {
      const opt = document.createElement('option');
      opt.value = option;
      opt.textContent = option;
      statusSelect.appendChild(opt);
    });
    
    // Update activeFloors when selections change
    equipmentSelect.addEventListener('change', (e) => {
      const current = activeFloors.get(floor) || { equipment: '', status: '' };
      activeFloors.set(floor, { ...current, equipment: e.target.value });
    });
    
    statusSelect.addEventListener('change', (e) => {
      const current = activeFloors.get(floor) || { equipment: '', status: '' };
      activeFloors.set(floor, { ...current, status: e.target.value });
    });
    
    floorWorkContainer.appendChild(box);
  }
}

// Make toggleFloor available globally
window.toggleFloor = toggleFloor;

/* ===== Form submission ===== */
document.getElementById('workForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  console.log('Form submitted!');
  
  const messageDiv = document.getElementById('message');
  
  // Validate floors
  if (activeFloors.size === 0) {
    messageDiv.innerHTML = '<div class="error-message">נא לבחור לפחות קומה אחת</div>';
    setTimeout(() => messageDiv.innerHTML = '', 3000);
    return;
  }
  
  // Collect floor work
  const floorWork = {};
  activeFloors.forEach((floorData, floor) => {
    if (typeof floorData === 'string') {
      // Legacy support for old format
      floorWork[floor] = floorData;
    } else {
      // New format with equipment and status
      floorWork[floor] = {
        equipment: floorData.equipment || '',
        status: floorData.status || ''
      };
    }
  });
  
  const formData = {
    workerName: document.getElementById('workerName').value,
    workDate: document.getElementById('workDate').value,
    project: document.getElementById('project').value,
    floors: floorWork,
    issues: document.getElementById('issues').value,
    nextVisit: document.getElementById('nextVisit').value,
    timestamp: new Date().toISOString()
  };
  
  console.log('Form data:', formData);
  
  const success = await saveReport(formData);
  
  console.log('Save result:', success);
  
  if (success) {
    // Create success overlay
    const overlay = document.createElement('div');
    overlay.className = 'success-overlay';
    overlay.innerHTML = `
      <div class="success-checkmark">
        <div class="checkmark-icon">✓</div>
      </div>
      <div class="success-text">!הדוח נשמר בהצלחה</div>
      <div class="success-subtext">הנתונים נשמרו במערכת</div>
    `;
    
    // Add confetti
    for (let i = 0; i < 50; i++) {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + '%';
      confetti.style.background = ['#ffd700', '#ff6b6b', '#4ecdc4', '#45b7d1', '#f7b731'][Math.floor(Math.random() * 5)];
      confetti.style.animationDelay = Math.random() * 0.5 + 's';
      confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
      overlay.appendChild(confetti);
    }
    
    document.body.appendChild(overlay);
    
    // Check what's in localStorage
    console.log('Data saved to Firebase!');
    
    setTimeout(() => {
      overlay.style.animation = 'overlayFadeIn 0.5s ease-out reverse';
      setTimeout(() => {
        overlay.remove();
        document.getElementById('workForm').reset();
        document.getElementById('selectionStep').style.display = 'block';
        const workForm = document.getElementById('workForm');
        workForm.classList.add('hidden');
        workForm.style.display = 'none';
        activeFloors.clear();
        document.querySelectorAll('.floor-chip').forEach(chip => chip.classList.remove('active'));
        floorWorkContainer.innerHTML = '';
      }, 500);
    }, 2500);
  } else {
    messageDiv.innerHTML = '<div class="error-message">שגיאה בשמירת הדוח. נסה שוב.</div>';
    setTimeout(() => messageDiv.innerHTML = '', 3000);
  }
});

// Navigation Drawer Setup
function setupNavigation() {
  const navToggle = document.getElementById('nav-toggle');
  const navDrawer = document.getElementById('nav-drawer');
  const navOverlay = document.getElementById('nav-overlay');
  const navItems = document.querySelectorAll('.nav-item');
  const protectedPages = new Set(['view', 'tofes']);
  const isDesktop = window.matchMedia('(min-width: 769px)').matches;

  if (!navToggle || !navDrawer || !navOverlay || !navItems.length) return;

  const closeDrawer = () => {
    navToggle.classList.remove('active');
    navDrawer.classList.remove('active');
    navOverlay.classList.remove('active');
  };

  if (!isDesktop) {
    closeDrawer();
    return;
  }
  
  // Get current page from URL
  const currentPage = window.location.pathname.split('/').pop().split('.')[0] || 'index';
  
  // Set active nav item
  navItems.forEach(item => {
    item.classList.remove('active');
    if (item.getAttribute('data-page') === currentPage) {
      item.classList.add('active');
    }
  });

  // Toggle drawer on hamburger click
  navToggle.addEventListener('click', () => {
    navToggle.classList.toggle('active');
    navDrawer.classList.toggle('active');
    navOverlay.classList.toggle('active');
  });
  
  // Close drawer on overlay click
  navOverlay.addEventListener('click', closeDrawer);
  
  // Close drawer when clicking a nav item
  navItems.forEach(item => {
    item.addEventListener('click', (e) => {
      const targetPage = item.getAttribute('data-page');
      if (protectedPages.has(targetPage)) {
        const accessCode = prompt('הכנס סיסמה:');
        if (accessCode !== '1') {
          e.preventDefault();
          alert('סיסמה שגויה');
          return;
        }
      }
      closeDrawer();
    });
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeDrawer();
  });

  window.addEventListener('resize', () => {
    if (!window.matchMedia('(min-width: 769px)').matches) {
      closeDrawer();
    }
  });
}

// Call setup when page loads
document.addEventListener('DOMContentLoaded', setupNavigation);
</script>
