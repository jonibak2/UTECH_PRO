<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" href="project/assets/logo.jpg" type="image/jpeg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>יומן עבודה</title>

<link rel="stylesheet" href="project/css/base.css" />

<style>
/* ===== Base ===== */
body {
  font-family: Arial, sans-serif;
  background: #ffffff;
  padding: 10px;
  margin: 0;
}

.header-nav {
  display: none;
  max-width: 600px;
  margin: 0 auto 20px auto;
  justify-content: space-between;
  align-items: center;
}

.nav-btn {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  background: #6AB053;
  color: white;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s;
  text-decoration: none;
  display: inline-block;
}

.nav-btn:hover {
  background: #5A9043;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(106, 176, 83, 0.3);
}

.nav-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}

.nav-sub-btn {
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  background: #6AB053;
  color: white;
  font-weight: bold;
  font-size: 13px;
  cursor: not-allowed;
  opacity: 0.6;
  transition: all 0.3s;
  text-decoration: none;
  display: inline-block;
}

.nav-sub-btn:hover {
  background: #6AB053;
}

@media (min-width: 769px) {
  .header-nav {
    display: flex;
  }
}

.container {
  max-width: 600px;
  margin: auto;
  animation: fadeInUp 0.5s ease-out forwards;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(-15px); }
  to { opacity: 1; transform: translateY(0); }
}

h1 {
  text-align: center;
  margin-bottom: 15px;
  font-size: 1.5em;
}

.logo {
  display: block;
  max-width: 320px;
  height: auto;
  margin: 0 auto 15px auto;
}

.form-group {
  margin-bottom: 12px;
}

label {
  font-weight: bold;
  display: block;
  margin-bottom: 5px;
  font-size: 0.9em;
}

.required {
  color: red;
}

input, textarea, select {
  width: 100%;
  padding: 8px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 0.9em;
  box-sizing: border-box;
}

textarea {
  min-height: 60px;
  resize: vertical;
}



/* ===== Floors grid ===== */
.floor-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
  gap: 6px;
}

.floor-chip {
  background: #f1f1f1;
  border-radius: 8px;
  text-align: center;
  padding: 8px 0;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
  user-select: none;
  font-size: 0.85em;
}

.floor-chip:hover {
  transform: scale(1.05);
}

.floor-chip.active {
  background: #6AB053;
  color: white;
}

/* ===== Floor box ===== */
.floor-box {
  background: #f8f9fa;
  border-radius: 8px;
  padding: 10px;
  margin-top: 8px;
  animation: fadeInUp 0.35s ease-out forwards;
}

.floor-title {
  font-weight: bold;
  margin-bottom: 8px;
  font-size: 0.9em;
}

.floor-work-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid #e0e0e0;
}

.floor-work-row:last-of-type {
  border-bottom: none;
  margin-bottom: 0;
  padding-bottom: 0;
}

.floor-work-row label {
  font-size: 0.8em;
  font-weight: 600;
  color: #555;
  margin-bottom: 2px;
}

.floor-work-row select {
  width: 100%;
  padding: 8px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 0.85em;
  background: #fff;
  box-sizing: border-box;
}

.floor-row-actions {
  display: flex;
  gap: 6px;
  margin-top: 4px;
}

.floor-add-row-btn,
.floor-remove-row-btn {
  flex: 1;
  border: none;
  border-radius: 6px;
  padding: 7px;
  font-size: 0.8em;
  cursor: pointer;
}

.floor-add-row-btn {
  background: #e8f5e3;
  color: #3d6b2f;
  font-weight: bold;
  margin-top: 8px;
  width: 100%;
}

.floor-remove-row-btn {
  background: #ffe8e8;
  color: #c0392b;
}

/* ===== Submit ===== */
.submit-btn {
  background: #6AB053;
  color: white;
  font-weight: bold;
  border: none;
  padding: 12px;
  border-radius: 6px;
  cursor: pointer;
  width: 100%;
  font-size: 1em;
  margin-top: 10px;
}

.submit-btn:hover {
  background: #5A9043;
}

/* ===== Wizard ===== */
.wizard-steps {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}

.wizard-step-dot {
  flex: 1;
  height: 4px;
  border-radius: 4px;
  background: #e0e0e0;
  transition: background 0.3s;
}

.wizard-step-dot.active,
.wizard-step-dot.done {
  background: #6AB053;
}

.wizard-panel {
  display: none;
  animation: fadeInUp 0.4s ease-out forwards;
}

.wizard-panel.active {
  display: block;
}

.wizard-title {
  text-align: center;
  margin: 0 0 6px;
  font-size: 1.4em;
}

.wizard-subtitle {
  text-align: center;
  color: #666;
  margin: 0 0 18px;
  font-size: 0.9em;
}

.choice-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.choice-card {
  background: #f8f9fa;
  border: 2px solid #e8e8e8;
  border-radius: 10px;
  padding: 16px 12px;
  text-align: center;
  cursor: pointer;
  font-weight: bold;
  font-size: 1em;
  transition: all 0.2s;
  user-select: none;
}

.choice-card:hover {
  border-color: #6AB053;
  background: #f0f8ed;
  transform: translateY(-2px);
}

.choice-card.selected {
  border-color: #6AB053;
  background: #6AB053;
  color: white;
}

.choice-card .choice-meta {
  display: block;
  font-weight: normal;
  font-size: 0.75em;
  color: #888;
  margin-top: 4px;
}

.choice-card.selected .choice-meta {
  color: rgba(255, 255, 255, 0.85);
}

.choice-card.project-card {
  text-align: right;
  padding: 14px;
}

.choice-card.project-card .project-card-name {
  font-size: 1.05em;
  margin-bottom: 4px;
}

.back-btn {
  background: none;
  border: none;
  color: #6AB053;
  font-weight: bold;
  cursor: pointer;
  padding: 0 0 12px;
  font-size: 0.9em;
}

.back-btn:hover {
  text-decoration: underline;
}

.selection-summary {
  background: #f0f8ed;
  border: 1px solid #c8e6b8;
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 16px;
  font-size: 0.9em;
  line-height: 1.6;
}

.selection-summary strong {
  color: #3d6b2f;
}

.empty-projects {
  text-align: center;
  padding: 30px 16px;
  color: #999;
  background: #f8f9fa;
  border-radius: 8px;
}

.success-message {
  background: #4caf50;
  color: white;
  padding: 12px;
  border-radius: 6px;
  text-align: center;
  margin-top: 15px;
  animation: fadeInUp 0.3s ease-out forwards;
}

.error-message {
  background: #f44336;
  color: white;
  padding: 12px;
  border-radius: 6px;
  text-align: center;
  margin-top: 15px;
}

/* ===== Success Overlay Animation ===== */
.success-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  opacity: 0;
  animation: overlayFadeIn 0.5s ease-out forwards;
}

@keyframes overlayFadeIn {
  0% {
    opacity: 0;
    transform: scale(0.9);
  }
  100% {
    opacity: 1;
    transform: scale(1);
  }
}

.success-checkmark {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 30px;
  animation: checkmarkPop 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.3s forwards;
  transform: scale(0);
}

@keyframes checkmarkPop {
  0% {
    transform: scale(0) rotate(0deg);
  }
  50% {
    transform: scale(1.2) rotate(180deg);
  }
  100% {
    transform: scale(1) rotate(360deg);
  }
}

.checkmark-icon {
  font-size: 60px;
  color: #4caf50;
  animation: checkmarkDraw 0.4s ease-out 0.6s forwards;
  opacity: 0;
}

@keyframes checkmarkDraw {
  to {
    opacity: 1;
  }
}

.success-text {
  color: white;
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 10px;
  animation: textSlideUp 0.5s ease-out 0.8s forwards;
  opacity: 0;
  transform: translateY(20px);
}

@keyframes textSlideUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.success-subtext {
  color: rgba(255, 255, 255, 0.9);
  font-size: 16px;
  animation: textSlideUp 0.5s ease-out 1s forwards;
  opacity: 0;
  transform: translateY(20px);
}

.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  background: #ffd700;
  animation: confettiFall 3s linear forwards;
}

@keyframes confettiFall {
  0% {
    transform: translateY(-100vh) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(100vh) rotate(720deg);
    opacity: 0;
  }
}

</style>
</head>

<div class="container">
<img src="project/assets/utech.png" alt="Utech" class="logo">

<div class="wizard-steps" aria-hidden="true">

</div>

<!-- Step 1: Worker -->
<div class="wizard-panel active" id="step-worker">
  <h1 class="wizard-title">מי אתה?</h1>

</div>

<div class="wizard-panel" id="step-project">

  <h1 class="wizard-title">בחר פרויקט</h1>
  <p class="wizard-subtitle" id="workerLabel"></p>
  <div id="projectGrid" class="choice-grid"></div>
  <div id="noProjects" class="empty-projects" style="display:none">
    אין פרויקטים במערכת.<br>הוסף פרויקט בדף <a href="view.html">יומני עבודה</a>.

</div>

<!-- Step 3: Form details -->
<div class="wizard-panel" id="step-form">
  <button type="button" class="back-btn" id="backToProject">← חזור לבחירת פרויקט</button>

  <form id="workForm">
    <input type="hidden" id="workerName" required>
    <input type="hidden" id="project" required>

    <div class="form-group">

      <input type="date" id="workDate" required>

    <div class="form-group">
      <label>בחירת קומות <span class="required">*</span></label>
      <p class="wizard-subtitle" id="floorsHint" style="margin-bottom:8px"></p>
      <div class="floor-grid" id="floorGrid"></div>
    </div>

    <div id="floorWorkContainer"></div>

    <div class="form-group">
      <label>תקלות / ליקויים שהתגלו</label>

      <label>מה נדרש להשלים בביקור הבא</label>

<script type="module">
/* ===== Firebase Setup ===== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDuvwDMAsyQSURluc7Mr-Ow5r2Iq2xh9P8",
  authDomain: "tofes-43c54.firebaseapp.com",
  databaseURL: "https://tofes-43c54-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tofes-43c54",
  storageBucket: "tofes-43c54.firebasestorage.app",
  messagingSenderId: "634166786476",
  appId: "1:634166786476:web:e5118489dcf3066fcba209",
  measurementId: "G-WS6QJN5RCT"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const database = getDatabase(app);

const WORKERS = ["פאבל", "שי", "ויקטור", "פימה", "יהונתן", "איציק", "יורי", "ראובן"];

const EQUIPMENT_OPTIONS = [
  "לובי 1 גלאי 1",
  "לובי 1 גלאי 2",
  "לובי מעליות",
  "לובי 2 גלאי 1",
  "לובי 2 גלאי 2",
  "שוט",
  "מדרגות 1",
  "מדרגות 2",
  "IN",
  "לחצן 1",
  "לחצן 2",
  "צופר 1",
  "צופר 2",
  "מגנט 1",
  "מגנט 2",
  "מגנט 3",
  "מגנט 4",
  "שקע טלפון חדר מדרגות 1",
  "שקע טלפון חדר מדרגות 2",
  "שקע טלפון לובי מעליות",
  "רמקול לובי 1",
  "רמקול לובי 2",
  "רמקול לובי מעליות",
  "רמקול חדר מדרגות 1",
  "רמקול חדר מדרגות 2"
];

const STATUS_OPTIONS = [
  { value: "לא בוצע צנרת", label: "לא בוצע צנרת" },
  { value: "חיווט בלבד", label: "חיווט בלבד" },
  { value: "הותקן אביזר קופ (למעט גלאי)", label: "הותקן אביזר קופ (למעט גלאי)" },
  { value: "הותקן גלאי", label: "הותקן גלאי" },
  { value: "הותקן בסיס", label: "הותקן בסיס" }
];

let projectsList = {};
let selectedWorker = "";
let selectedProject = null;

const floorGrid = document.getElementById("floorGrid");
const floorWorkContainer = document.getElementById("floorWorkContainer");
const activeFloors = new Map();

function goToStep(step) {
  document.querySelectorAll(".wizard-panel").forEach((p) => p.classList.remove("active"));
  document.querySelectorAll(".wizard-step-dot").forEach((d) => d.classList.remove("active", "done"));

  document.getElementById(`step-${step === 1 ? "worker" : step === 2 ? "project" : "form"}`).classList.add("active");

  for (let i = 1; i <= 3; i++) {
    const dot = document.getElementById(`dot-step-${i}`);
    if (i < step) dot.classList.add("done");
    if (i === step) dot.classList.add("active");
  }
}

function renderWorkers() {
  const grid = document.getElementById("workerGrid");
  grid.innerHTML = "";
  WORKERS.forEach((name) => {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "choice-card";
    card.textContent = name;
    card.addEventListener("click", () => selectWorker(name));
    grid.appendChild(card);
  });
}

function selectWorker(name) {
  selectedWorker = name;
  document.getElementById("workerName").value = name;
  document.getElementById("workerLabel").textContent = `שלום, ${name}!`;
  renderProjects();
  goToStep(2);
}

function renderProjects() {
  const grid = document.getElementById("projectGrid");
  const noProjects = document.getElementById("noProjects");
  const projects = Object.values(projectsList).sort((a, b) =>
    a.name.localeCompare(b.name, "he")
  );

  grid.innerHTML = "";

  if (projects.length === 0) {
    grid.style.display = "none";
    noProjects.style.display = "block";
    return;
  }

  grid.style.display = "grid";
  noProjects.style.display = "none";

  projects.forEach((project) => {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "choice-card project-card";
    const floors = Number(project.floors);
    card.innerHTML = `
      <div class="project-card-name">${project.name}</div>
      ${project.address ? `<span class="choice-meta">${project.address}</span>` : ""}
      <span class="choice-meta">${Number.isInteger(floors) && floors >= 0 ? `${floors} קומות` : "קומות לא הוגדרו"}</span>
    `;
    card.addEventListener("click", () => selectProject(project));
    grid.appendChild(card);
  });
}

function selectProject(project) {
  selectedProject = project;
  document.getElementById("project").value = project.name;

  const floors = Number(project.floors);
  const summary = document.getElementById("selectionSummary");
  summary.innerHTML = `
    <strong>עובד:</strong> ${selectedWorker}<br>
    <strong>פרויקט:</strong> ${project.name}
    ${project.manager ? `<br><strong>מנהל:</strong> ${project.manager}` : ""}
  `;

  buildFloorGrid(floors);
  goToStep(3);
}

function buildFloorGrid(maxFloor) {
  floorGrid.innerHTML = "";
  floorWorkContainer.innerHTML = "";
  activeFloors.clear();

  const hint = document.getElementById("floorsHint");
  if (!Number.isInteger(maxFloor) || maxFloor < 0) {
    hint.textContent = "לפרויקט זה לא הוגדר מספר קומות — פנה למנהל.";
    return;
  }

  hint.textContent = `בחר קומות (מקומה -5 עד ${maxFloor})`;

  for (let i = -5; i <= maxFloor; i++) {
    const chip = document.createElement("div");
    chip.className = "floor-chip";
    chip.textContent = i;
    chip.addEventListener("click", () => toggleFloor(i, chip));
    floorGrid.appendChild(chip);
  }
}

function loadProjects() {
  const projectsRef = ref(database, "projects");
  onValue(projectsRef, (snapshot) => {
    projectsList = snapshot.val() || {};
    if (selectedWorker && !selectedProject) {
      renderProjects();
    }
  });
}

loadProjects();
renderWorkers();

document.getElementById("backToWorker").addEventListener("click", () => {
  selectedProject = null;
  goToStep(1);
});

document.getElementById("backToProject").addEventListener("click", () => {
  selectedProject = null;
  document.getElementById("project").value = "";
  floorGrid.innerHTML = "";
  floorWorkContainer.innerHTML = "";
  activeFloors.clear();
  goToStep(2);
});

async function saveReport(data) {
          try {
            console.log('Saving report to Firebase...');
            
            const workerName = data.workerName;
            const workDate = data.workDate;
            
            // Structure: workLogs/{workerName}/{date}/{project}/{reportData}
            const reportPath = `workLogs/${workerName}/${workDate}/${data.project}`;
            const reportRef = ref(database, reportPath);
            
            await set(reportRef, {
              floors: data.floors,
              issues: data.issues,
              nextVisit: data.nextVisit,
              timestamp: data.timestamp
            });
            
            console.log('Saved successfully to Firebase at:', reportPath);
            return true;
          } catch (err) {
            console.error('Error saving to Firebase:', err);
            return false;
          }
        }

function createFloorWorkRow(floor, box) {
  const row = document.createElement("div");
  row.className = "floor-work-row";
  row.dataset.floor = floor;

  const eqLabel = document.createElement("label");
  eqLabel.textContent = "אביזר / מיקום";
  const eqSelect = document.createElement("select");
  eqSelect.className = "floor-equipment-select";
  eqSelect.innerHTML = '<option value="">בחר אביזר</option>';
  EQUIPMENT_OPTIONS.forEach((eq) => {
    const opt = document.createElement("option");
    opt.value = eq;
    opt.textContent = eq;
    eqSelect.appendChild(opt);
  });

  const statusLabel = document.createElement("label");
  statusLabel.textContent = "סטטוס ביצוע";
  const statusSelect = document.createElement("select");
  statusSelect.className = "floor-status-select";
  statusSelect.innerHTML = '<option value="">בחר סטטוס</option>';
  STATUS_OPTIONS.forEach((s) => {
    const opt = document.createElement("option");
    opt.value = s.value;
    opt.textContent = s.label;
    statusSelect.appendChild(opt);
  });

  const actions = document.createElement("div");
  actions.className = "floor-row-actions";
  const removeBtn = document.createElement("button");
  removeBtn.type = "button";
  removeBtn.className = "floor-remove-row-btn";
  removeBtn.textContent = "הסר שורה";
  removeBtn.addEventListener("click", () => {
    const rows = box.querySelectorAll(".floor-work-row");
    if (rows.length <= 1) return;
    row.remove();
    updateFloorRowRemoveButtons(box);
  });

  actions.appendChild(removeBtn);
  row.append(eqLabel, eqSelect, statusLabel, statusSelect, actions);
  return row;
}

function updateFloorRowRemoveButtons(box) {
  const rows = box.querySelectorAll(".floor-work-row");
  rows.forEach((row) => {
    const btn = row.querySelector(".floor-remove-row-btn");
    if (btn) btn.style.display = rows.length > 1 ? "block" : "none";
  });
}

function createFloorBox(floor) {
  const box = document.createElement("div");
  box.className = "floor-box";
  box.dataset.floor = floor;

  const title = document.createElement("div");
  title.className = "floor-title";
  title.textContent = `עבודה בקומה ${floor}`;

  const rowsWrap = document.createElement("div");
  rowsWrap.className = "floor-rows-wrap";
  rowsWrap.appendChild(createFloorWorkRow(floor, box));

  const addRowBtn = document.createElement("button");
  addRowBtn.type = "button";
  addRowBtn.className = "floor-add-row-btn";
  addRowBtn.textContent = "➕ הוסף אביזר בקומה זו";
  addRowBtn.addEventListener("click", () => {
    rowsWrap.appendChild(createFloorWorkRow(floor, box));
    updateFloorRowRemoveButtons(box);
  });

  box.append(title, rowsWrap, addRowBtn);
  updateFloorRowRemoveButtons(box);
  return box;
}

function toggleFloor(floor, chip) {
  if (activeFloors.has(floor)) {
    activeFloors.delete(floor);
    chip.classList.remove("active");
    document.querySelector(`.floor-box[data-floor="${floor}"]`)?.remove();
  } else {
    activeFloors.set(floor, true);
    chip.classList.add("active");
    floorWorkContainer.appendChild(createFloorBox(floor));
  }
}

function collectFloorWork() {
  const floorWork = {};

  document.querySelectorAll(".floor-box").forEach((box) => {
    const floor = box.dataset.floor;
    const rows = [];

    box.querySelectorAll(".floor-work-row").forEach((row) => {
      const equipment = row.querySelector(".floor-equipment-select")?.value.trim();
      const status = row.querySelector(".floor-status-select")?.value.trim();
      if (equipment && status) {
        rows.push({ equipment, status });
      }
    });

    if (rows.length === 0) return;

    if (rows.length === 1) {
      floorWork[floor] = { equipment: rows[0].equipment, status: rows[0].status };
    } else {
      floorWork[floor] = {
        equipment: rows.map((r) => r.equipment).join(", "),
        status: rows[0].status
      };
    }
  });

  return floorWork;
}

document.getElementById("workDate").valueAsDate = new Date();

/* ===== Form submission ===== */
document.getElementById('workForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  console.log('Form submitted!');
  
  const messageDiv = document.getElementById("message");

  if (!selectedWorker || !selectedProject) {
    messageDiv.innerHTML = '<div class="error-message">נא לבחור שם ופרויקט</div>';
    setTimeout(() => (messageDiv.innerHTML = ""), 3000);
    return;
  }

  if (floorGrid.children.length === 0) {
    messageDiv.innerHTML = '<div class="error-message">לפרויקט לא הוגדרו קומות — עדכן את הפרויקט בדף יומני עבודה</div>';
    setTimeout(() => (messageDiv.innerHTML = ""), 4000);
    return;
  }

  // Validate floors
  if (activeFloors.size === 0) {
    messageDiv.innerHTML = '<div class="error-message">נא לבחור לפחות קומה אחת</div>';
    setTimeout(() => messageDiv.innerHTML = '', 3000);
    return;
  }

  const floorWork = collectFloorWork();
  const filledFloors = Object.keys(floorWork);

  if (filledFloors.length === 0) {
    messageDiv.innerHTML = '<div class="error-message">נא למלא אביזר וסטטוס לכל קומה שנבחרה</div>';
    setTimeout(() => messageDiv.innerHTML = '', 3000);
    return;
  }

  if (filledFloors.length < activeFloors.size) {
    messageDiv.innerHTML = '<div class="error-message">יש קומות ללא אביזר או סטטוס — מלא את כל השדות</div>';
    setTimeout(() => messageDiv.innerHTML = '', 4000);
    return;
  }

  let incompleteRow = false;
  let mixedStatusFloor = null;
  document.querySelectorAll(".floor-box").forEach((box) => {
    const statuses = new Set();
    box.querySelectorAll(".floor-work-row").forEach((row) => {
      const equipment = row.querySelector(".floor-equipment-select")?.value.trim();
      const status = row.querySelector(".floor-status-select")?.value.trim();
      if ((equipment && !status) || (!equipment && status)) {
        incompleteRow = true;
      }
      if (equipment && status) statuses.add(status);
    });
    if (statuses.size > 1) {
      mixedStatusFloor = box.dataset.floor;
    }
  });
  if (incompleteRow) {
    messageDiv.innerHTML = '<div class="error-message">בכל שורה יש לבחור גם אביזר וגם סטטוס</div>';
    setTimeout(() => messageDiv.innerHTML = "", 3000);
    return;
  }
  if (mixedStatusFloor !== null) {
    messageDiv.innerHTML = `<div class="error-message">בקומה ${mixedStatusFloor} כל האביזרים חייבים להיות באותו סטטוס</div>`;
    setTimeout(() => messageDiv.innerHTML = "", 4000);
    return;
  }
  
  const formData = {
    workerName: document.getElementById('workerName').value,
    workDate: document.getElementById('workDate').value,
    project: document.getElementById('project').value,
    floors: floorWork,
    issues: document.getElementById('issues').value,
    nextVisit: document.getElementById('nextVisit').value,
    timestamp: new Date().toISOString()
  };
  
  console.log('Form data:', formData);
  
  const success = await saveReport(formData);
  
  console.log('Save result:', success);
  
  if (success) {
    // Create success overlay
    const overlay = document.createElement('div');
    overlay.className = 'success-overlay';
    overlay.innerHTML = `
      <div class="success-checkmark">
        <div class="checkmark-icon">✓</div>
      </div>
      <div class="success-text">!הדוח נשמר בהצלחה</div>
      <div class="success-subtext">הנתונים נשמרו במערכת</div>
    `;
    
    // Add confetti
    for (let i = 0; i < 50; i++) {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + '%';
      confetti.style.background = ['#ffd700', '#ff6b6b', '#4ecdc4', '#45b7d1', '#f7b731'][Math.floor(Math.random() * 5)];
      confetti.style.animationDelay = Math.random() * 0.5 + 's';
      confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
      overlay.appendChild(confetti);
    }
    
    document.body.appendChild(overlay);
    
    // Check what's in localStorage
    console.log('Data saved to Firebase!');
    
    setTimeout(() => {
      overlay.style.animation = "overlayFadeIn 0.5s ease-out reverse";
      setTimeout(() => {
        overlay.remove();
        selectedWorker = "";
        selectedProject = null;
        document.getElementById("workForm").reset();
        document.getElementById("workDate").valueAsDate = new Date();
        document.getElementById("workerName").value = "";
        document.getElementById("project").value = "";
        activeFloors.clear();
        floorGrid.innerHTML = "";
        floorWorkContainer.innerHTML = "";
        goToStep(1);
      }, 500);
    }, 2500);
  } else {
    messageDiv.innerHTML = '<div class="error-message">שגיאה בשמירת הדוח. נסה שוב.</div>';
    setTimeout(() => messageDiv.innerHTML = '', 3000);
  }
});

// Navigation Drawer Setup
function setupNavigation() {
  const navToggle = document.getElementById('nav-toggle');
  const navDrawer = document.getElementById('nav-drawer');
  const navOverlay = document.getElementById('nav-overlay');
  const navItems = document.querySelectorAll('.nav-item');
  const isDesktop = window.matchMedia('(min-width: 769px)').matches;

  if (!navToggle || !navDrawer || !navOverlay || !navItems.length) return;

  const closeDrawer = () => {
    navToggle.classList.remove('active');
    navDrawer.classList.remove('active');
    navOverlay.classList.remove('active');
  };

  if (!isDesktop) {
    closeDrawer();
    return;
  }
  
  // Get current page from URL
  const currentPage = window.location.pathname.split('/').pop().split('.')[0] || 'index';
  
  // Set active nav item
  navItems.forEach(item => {
    item.classList.remove('active');
    if (item.getAttribute('data-page') === currentPage) {
      item.classList.add('active');
    }
  });
  
  // Toggle drawer on hamburger click
  navToggle.addEventListener('click', () => {
    navToggle.classList.toggle('active');
    navDrawer.classList.toggle('active');
    navOverlay.classList.toggle('active');
  });
  
  // Close drawer on overlay click
  navOverlay.addEventListener('click', closeDrawer);
  
  // Close drawer when clicking a nav item
  navItems.forEach(item => {
    item.addEventListener('click', () => {
      closeDrawer();
    });
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeDrawer();
  });

  window.addEventListener('resize', () => {
    if (!window.matchMedia('(min-width: 769px)').matches) {
      closeDrawer();
    }
  });
}

// Call setup when page loads
document.addEventListener('DOMContentLoaded', setupNavigation);
</script>
